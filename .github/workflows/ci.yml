name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify version metadata
        run: node scripts/verify-version.mjs

      - name: Typecheck and run tests
        run: npm run check

      - name: Build release package
        run: node scripts/package.mjs

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-formatter-plugin
          path: |
            main.js
            manifest.json
            styles.css
            dist/obsidian-social-formatter-*.zip
          if-no-files-found: error
          retention-days: 14
