name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tag and version metadata
        run: node scripts/verify-version.mjs "${GITHUB_REF_NAME}"

      - name: Typecheck and run tests
        run: npm run check

      - name: Build release package
        run: node scripts/package.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Social Formatter ${{ github.ref_name }}
          token: ${{ github.token }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
            dist/obsidian-social-formatter-*.zip
